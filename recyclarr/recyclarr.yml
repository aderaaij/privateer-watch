# Recyclarr configuration — TRaSH-guides sync for Radarr + Sonarr
#
# Purpose: "space saver" quality profiles that replace oversized files
# (remuxes, bloated 2160p) with efficient encodes of similar visual quality.
#
# The profiles below deliberately merge Remux qualities into the same quality
# GROUP as encodes/WEB. Radarr/Sonarr never downgrade across quality tiers,
# but within a group the custom-format score decides — so a well-encoded
# 20GB release outscores a 90GB remux (which carries a -10000 penalty CF)
# and gets imported as an "upgrade", deleting the old file.
#
# The penalty custom formats ("Remux Penalty", "2160p Penalty", "Foreign Dub
# Penalty") are NOT TRaSH formats — they are created directly via the API (see
# scripts/setup_space_saver_profiles.sh) and protected from recyclarr's
# score reset via the `except:` lists below.
#
# Foreign Dub Penalty blocks language-prefixed dub tags (HebDub, GerDub) that
# TRaSH's "Dubs Only" regex misses. A bare "DUBBED" tag is deliberately still
# allowed — on anime that's the English dub.
#
# WEB-1080p Anime is the same space-saver skeleton as WEB-1080p but scored
# with the TRaSH anime CFs (release-group tiers, anime streaming services).
# WEB-2160p Anime is its 4K sibling (skeleton of WEB-2160p, same anime CFs
# plus HDR) for shows deliberately kept at 2160p.
# Deliberate deviations from TRaSH's anime template:
#   - no "Dubs Only" block (bare DUBBED = the wanted English dub)
#   - no main-guide Remux Tier boosts (+975/+950 would defeat Remux Penalty;
#     anime BD Tier 05 "Remuxes" +1000 - 1000 penalty = 0 → last resort)
#   - no "x265 (HD)" block — good anime encodes ARE x265/10bit
#   - quality_definition stays type:series (anime sizes are smaller, so the
#     series max caps never bite; a per-instance setting, can't differ anyway)
#
# Remux-as-last-resort: Remux Penalty is -1000 with min_format_score -2000,
# so a remux is grabbable when it's the ONLY release (new adds, rare old
# anime BDs) but always loses to any encode (score >= 0) and gets upgraded
# away once one appears. 2160p Penalty stays -10000 (below the floor) so 4K
# never sneaks into 1080p profiles. LQ/upscale junk (-10000) stays blocked.
#
# API keys come from container env vars (see docker-compose.yml).

# Instance names must be globally unique across radarr+sonarr since
# recyclarr v8 - two instances named `main` abort every sync.
radarr:
  radarr:
    base_url: !env_var RADARR_URL http://radarr:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: true

    quality_definition:
      type: movie

    quality_profiles:
      # For movies that are currently 2160p (incl. remuxes) and should STAY 4K,
      # just as efficient encodes.
      - name: UHD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
          except:
            - Remux Penalty
            - Foreign Dub Penalty
        upgrade:
          allowed: true
          until_quality: 2160p
          until_score: 10000
        min_format_score: -2000
        quality_sort: top
        qualities:
          - name: 2160p
            qualities:
              - Remux-2160p
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p

      # For oversized 1080p movies (incl. 1080p/VC-1 remuxes).
      - name: HD Bluray + WEB
        reset_unmatched_scores:
          enabled: true
          except:
            - Remux Penalty
            - Foreign Dub Penalty
        upgrade:
          allowed: true
          until_quality: 1080p
          until_score: 10000
        min_format_score: -2000
        quality_sort: top
        qualities:
          - name: 1080p
            qualities:
              - Remux-1080p
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
          - name: Bluray-720p

