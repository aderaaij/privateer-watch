sonarr:
  sonarr:
    base_url: !env_var SONARR_URL http://sonarr:8989
    api_key: !env_var SONARR_API_KEY
    delete_old_custom_formats: true

    quality_definition:
      type: series

    quality_profiles:
      # Default TV profile: everything lands at efficient 1080p WEB.
      # 2160p qualities are in the SAME group so existing 4K/remux files
      # (scored -10000 by the penalty CFs) get replaced by 1080p releases.
      - name: WEB-1080p
        reset_unmatched_scores:
          enabled: true
          except:
            - Remux Penalty
            - 2160p Penalty
            - Foreign Dub Penalty
        upgrade:
          allowed: true
          until_quality: 1080p
          until_score: 10000
        min_format_score: -2000
        quality_sort: top
        qualities:
          - name: 1080p
            qualities:
              - Bluray-2160p Remux
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - Bluray-1080p Remux
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p

      # 4K profile for visually interesting shows: stays 2160p, but remuxes
      # and disc bloat get replaced by efficient 2160p WEB releases.
      - name: WEB-2160p
        reset_unmatched_scores:
          enabled: true
          except:
            - Remux Penalty
            - Foreign Dub Penalty
        upgrade:
          allowed: true
          until_quality: 2160p
          until_score: 10000
        min_format_score: -2000
        quality_sort: top
        qualities:
          - name: 2160p
            qualities:
              - Bluray-2160p Remux
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
          - name: WEB 1080p
            qualities:
              - WEBDL-1080p
              - WEBRip-1080p

      # Anime: space-saver skeleton (2160p/remux merged into the 1080p group,
      # penalty CFs push them out) + a 720p floor for old shows/OVAs that
      # never got a 1080p release. Scored via the TRaSH anime CFs below.
      # HDTV qualities are included (unlike the other profiles): fansub
      # releases without a source tag ([Group] Show - 01 [1080p]) parse as
      # HDTV and would otherwise all be rejected.
      - name: WEB-1080p Anime
        score_set: anime-sonarr
        reset_unmatched_scores:
          enabled: true
          except:
            - Remux Penalty
            - 2160p Penalty
            - Foreign Dub Penalty
        upgrade:
          allowed: true
          until_quality: 1080p
          until_score: 10000
        min_format_score: -2000
        quality_sort: top
        qualities:
          - name: 1080p
            qualities:
              - Bluray-2160p Remux
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
              - Bluray-1080p Remux
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p
          - name: 720p
            qualities:
              - Bluray-720p
              - WEBDL-720p
              - WEBRip-720p
              - HDTV-720p

      # 4K anime for shows deliberately kept at 2160p (real 4K files exist or
      # wanted): stays 2160p, remuxes/disc bloat replaced by efficient 2160p
      # releases, full 1080p group as fallback until a 4K release exists.
      # No 2160p Penalty here, obviously.
      - name: WEB-2160p Anime
        score_set: anime-sonarr
        reset_unmatched_scores:
          enabled: true
          except:
            - Remux Penalty
            - Foreign Dub Penalty
        upgrade:
          allowed: true
          until_quality: 2160p
          until_score: 10000
        min_format_score: -2000
        quality_sort: top
        qualities:
          - name: 2160p
            qualities:
              - Bluray-2160p Remux
              - Bluray-2160p
              - WEBDL-2160p
              - WEBRip-2160p
          - name: 1080p
            qualities:
              - Bluray-1080p Remux
              - Bluray-1080p
              - WEBDL-1080p
              - WEBRip-1080p
              - HDTV-1080p

    custom_formats:
